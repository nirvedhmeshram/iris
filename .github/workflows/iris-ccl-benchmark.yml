name: Iris CCL Benchmark (Iris vs RCCL)

# A measurement job, not a gate: it publishes Iris vs RCCL latencies for the CCL
# collectives and fails only if the sweep itself breaks.
#
# Runs on a self-hosted runner labelled mi355x-slurm, which submits the sweep
# as a 1-node Slurm job on 8x MI355X (.github/scripts/cluster/). Holding a
# whole node no longer crowds out the test jobs, so pull requests get a small
# grid on every push; pushes to main and manual runs keep the full grid --
# three collectives x 2/4/8 ranks x 16 shapes (2 MiB to 1 GiB) x
# fp16/bf16/fp8, for Iris and RCCL.
#
# The scheduler settings are repository variables (IRIS_CLUSTER_ACCOUNT,
# IRIS_CLUSTER_QOS, optional IRIS_CLUSTER_PARTITION, IRIS_CLUSTER_GRES,
# IRIS_CLUSTER_CACHE); until IRIS_CLUSTER_ACCOUNT is set, the job is skipped
# rather than left queued. Pull requests from forks run in the `cluster-ci`
# environment, whose required reviewers approve each run, so code from a fork
# never reaches the cluster unreviewed.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      num_ranks:
        description: "Comma-separated rank counts"
        required: false
        default: "2,4,8"
      dtypes:
        description: "Comma-separated dtypes (fp8 is Iris-only; RCCL has no fp8)"
        required: false
        default: "fp16,bf16,fp8"
      m_values:
        description: "Comma-separated M values (rows, i.e. tokens)"
        required: false
        default: "1024,4096,16384,65536"
      n_values:
        description: "Comma-separated N values (columns, i.e. hidden size)"
        required: false
        default: "1024,2048,4096,8192"
      n_repeat:
        description: "Timed iterations per point"
        required: false
        default: "50"

permissions:
  contents: read

# A newer push to the same pull request replaces its queued or running sweep.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ccl-benchmark:
    name: CCL benchmark (Iris vs RCCL, MI355X)
    if: vars.IRIS_CLUSTER_ACCOUNT != ''
    runs-on: [self-hosted, mi355x-slurm]
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'cluster-ci' || '' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 360 }}

    # Dispatch inputs are bound to environment variables rather than
    # interpolated into run: blocks. ${{ }} expansion happens before the shell
    # sees the script, so interpolating user-controlled input directly is a
    # command-injection vector. Pull requests get a small grid that runs in about two
    # minutes once the image is on the node; M=65536 alone takes longer than that.
    env:
      NUM_RANKS: ${{ github.event.inputs.num_ranks || (github.event_name == 'pull_request' && '8' || '2,4,8') }}
      DTYPES: ${{ github.event.inputs.dtypes || (github.event_name == 'pull_request' && 'bf16' || 'fp16,bf16,fp8') }}
      M_VALUES: ${{ github.event.inputs.m_values || (github.event_name == 'pull_request' && '1024,4096,16384' || '1024,4096,16384,65536') }}
      N_VALUES: ${{ github.event.inputs.n_values || (github.event_name == 'pull_request' && '1024,8192' || '1024,2048,4096,8192') }}
      N_REPEAT: ${{ github.event.inputs.n_repeat || (github.event_name == 'pull_request' && '20' || '50') }}
      JOB_TIME: ${{ github.event_name == 'pull_request' && '0:50:00' || '5:45:00' }}
      IRIS_CLUSTER_ACCOUNT: ${{ vars.IRIS_CLUSTER_ACCOUNT }}
      IRIS_CLUSTER_QOS: ${{ vars.IRIS_CLUSTER_QOS }}
      IRIS_CLUSTER_PARTITION: ${{ vars.IRIS_CLUSTER_PARTITION }}
      IRIS_CLUSTER_GRES: ${{ vars.IRIS_CLUSTER_GRES }}
      IRIS_CLUSTER_CACHE: ${{ vars.IRIS_CLUSTER_CACHE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the sweep uploads artifacts -- do not leave
          # credentials in .git/config where they could be packaged up.
          persist-credentials: false

      - name: Run the sweep on one node
        run: |
          # Validate first: run_ccl_benchmark.sh checks the rest of its inputs.
          if ! [[ "$NUM_RANKS" =~ ^[1-8](,[1-8])*$ ]]; then
            echo "[ERROR] num_ranks must be comma-separated integers 1-8, got '$NUM_RANKS'"
            exit 1
          fi
          rm -rf ccl_results
          bash .github/scripts/cluster/launch.sh 1 "$JOB_TIME" \
            bash .github/scripts/run_ccl_benchmark.sh "$NUM_RANKS" "$DTYPES" "$M_VALUES" "$N_VALUES" "$N_REPEAT"

      - name: Publish the comparison table
        if: always()
        run: |
          if [ -f ccl_results/summary.md ]; then
            {
              echo "## Iris vs RCCL on MI355X — ranks ${NUM_RANKS}, ${DTYPES}"
              echo ""
              echo "Commit \`${GITHUB_SHA::8}\`. Speedup is RCCL latency / Iris latency: above 1.00x means Iris is faster."
              echo "One image per collective and dtype is in the run's artifact."
              echo ""
              cat ccl_results/summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary produced; see the sweep step for why." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
        with:
          name: ccl-benchmark-${{ github.run_id }}
          path: ccl_results/
